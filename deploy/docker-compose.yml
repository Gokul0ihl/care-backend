# Stack for the single EC2 box. Mirrors CARE's own
# docker-compose.pre-built.yaml, but runs our own image, built on the box by
# deploy/deploy.sh (no registry), and adds Postgres as a container instead of
# using a managed DB.
#
# Lives in /opt/ihl-hims/deploy on the box. deploy.sh copies this file there
# when it changes, sets BACKEND_IMAGE in .env and runs docker compose up -d.
# Never run `docker compose pull` there: the backend image only exists locally.

# Full debug mode for the dev box: Django DEBUG (tracebacks in error
# responses), DEBUG logging including every SQL query, request timings, and
# debug-level gunicorn and celery logs. These override .env. Turn it off by
# deleting the `environment: *debug` lines below. Never keep it on a box with
# real patient data: error pages and logs then include request data and settings.
x-debug: &debug
  DJANGO_DEBUG: "True"
  DJANGO_LOG_LEVEL: DEBUG
  DJANGO_DB_LOG_LEVEL: DEBUG
  ENABLE_REQUEST_TIME_LOGGING: "True"
  GUNICORN_LOG_LEVEL: debug
  CELERY_LOG_LEVEL: debug

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ihl_hims}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
    # Published on the EC2 host's loopback only (not public) - reach it via an
    # SSH tunnel (e.g. pgAdmin's SSH Tunnel tab), never via the security group.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  backend:
    image: ${BACKEND_IMAGE}
    env_file: .env
    environment: *debug
    entrypoint: ["bash", "start.sh"]
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-beat:
        condition: service_healthy

  celery-worker:
    image: ${BACKEND_IMAGE}
    env_file: .env
    environment: *debug
    entrypoint: ["bash", "celery_worker.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ${BACKEND_IMAGE}
    env_file: .env
    environment: *debug
    entrypoint: ["bash", "celery_beat.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
