
networks:
  default:
    name: care

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./docker/.local.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./care-backups}:/backups
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s

  minio:
    image: pgsty/silo:latest  # minio/minio is no longer published on Docker Hub; Silo is a drop-in fork
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ap-south-1  # To maintain compatibility with existing apps
    volumes:
      - "./care/media/minio:/data"
      - "./docker/minio/init-script.sh:/init-script.sh:ro"  # Mount the init script
      - "./docker/minio/entrypoint.sh:/entrypoint.sh:ro"  # Mount the entrypoint script
    ports:
      - "9100:9000"  # S3 API
      - "9001:9001"  # Web Console
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
  backend:
    image: care_local
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        ADDITIONAL_PLUGS: ${ADDITIONAL_PLUGS:-}
    env_file:
      - ./docker/.local.env
    environment:
      # Local checkout of the care_emergency plug (see plug_config.py); set
      # CARE_EMERGENCY_PATH in .env if it is not at ../../IHL/care_emergency
      PYTHONPATH: /plugs/care_emergency
      # data.gov.in key for the plug's monthly India Post PIN directory refresh;
      # set it in .env. Without it the frontend uses a live PIN lookup.
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      # Frontend origin for the registration form texted at Quick Register.
      REGISTRATION_FORM_BASE_URL: ${REGISTRATION_FORM_BASE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - ${CARE_EMERGENCY_PATH:-../../IHL/care_emergency}:/plugs/care_emergency
    entrypoint: ["bash", "scripts/start-dev.sh"]
    ports:
      - "9000:9000"
      - "9876:9876" #debugpy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      celery:
        condition: service_healthy

  celery:
    image: care_local
    env_file:
      - ./docker/.local.env
    entrypoint: ["bash", "scripts/celery-dev.sh"]
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      PYTHONPATH: /plugs/care_emergency
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
    volumes:
      - .:/app
      - ${CARE_EMERGENCY_PATH:-../../IHL/care_emergency}:/plugs/care_emergency

volumes:
  postgres-data:
  redis-data:
