[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care"
version = "3.0"
description = "A Django app for managing healthcare across hospitals and care centers."
authors = [
    {name = "Open Healthcare Network", email = "info@ohc.network"}
]
license = {text = "MIT"}
keywords = ["django", "care", "ohc"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = "==3.13.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "authlib==1.6.12",
    "boto3==1.43.6",
    "celery==5.6.0",
    "django==6.0",
    "django-anymail[amazon-ses]",
    "django-environ==0.12.0",
    "django-cors-headers==4.9.0",
    "django-filter==25.2",
    "django-maintenance-mode==0.22.0",
    "django-ratelimit==4.1.0",
    "django-redis==6.0.0",
    "djangoql==0.18.1",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "dry-rest-permissions==0.1.10",
    "drf-nested-routers==0.95.0",
    "drf-spectacular==0.29.0",
    "gunicorn==23.0.0",
    "healthy-django==0.1.0",
    "jinja2==3.1.6",
    "json-fingerprint==0.14.1",
    "jsonschema==4.25.1",
    "pillow==12.2.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.12.5",
    "pyjwt==2.12.0",
    "pyotp==2.9.0",
    "python-slugify==8.0.4",
    "pywebpush==2.1.2",
    "redis[hiredis]==7.1.0",
    "requests==2.33.0",
    "simplejson==3.20.2",
    "sentry-sdk==2.58.0",
    "whitenoise==6.11.0",
    "pydantic-extra-types==2.10.6",
    "phonenumberslite==9.0.19",
    "python-magic==0.4.28",
    "django-import-export==4.3.14",
    "evalidate==2.1.3",
    "weasyprint==68.0",
    "pip==26.0",
    "urllib3==2.7.0",
]

[project.urls]
Homepage = "https://github.com/ohcnetwork/care"

[dependency-groups]
dev = [
    "boto3-stubs[s3,boto3]==1.43.6",
    "coverage==7.13.0",
    "debugpy==1.8.17",
    "django-coverage-plugin==3.2.0",
    "django-extensions==4.1",
    "django-silk==5.4.3",
    "djangorestframework-stubs==3.16.6",
    "freezegun==1.5.5",
    "ipython==9.8.0",
    "mypy==1.19.1",
    "pre-commit==4.5.0",
    "tblib==3.2.2",
    "watchdog==6.0.0",
    "werkzeug==3.1.6",
    "ruff==0.14.14",
    "model-bakery==1.20.5",
    "Faker==38.2.0",
]
docs = [
    "sphinx==8.2.3",
    "furo==2025.9.25",
    "myst-parser==4.0.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

# OHC's python-magic build bundles libmagic, so the image doesn't need libmagic1.
[[tool.uv.index]]
name = "python-magic-bin"
url = "https://github.com/ohcnetwork/python-magic-bin/releases/expanded_assets/v0.1"
format = "flat"
explicit = true

[tool.uv.sources]
python-magic = { index = "python-magic-bin" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["care*"]


[tool.coverage.run]
branch = true
source = ["care", "config", "plugs"]
parallel = true
concurrency = ["multiprocessing"]
# relative_files = true
omit = ["care/facility/**", "care/users/**", "*/tests/**", "*/migrations/**"]


[tool.coverage.report]
exclude_also = [
  'def __repr__',
  'if self.debug:',
  'if settings.DEBUG',
  'raise AssertionError',
  'raise NotImplementedError',
  'if __name__ == .__main__.:',
  'if TYPE_CHECKING:',
]
ignore_errors = true
omit = ["care/facility/**", "care/users/**", "*/tests/**", "*/migrations*/**"]


[tool.ruff]
target-version = "py313"
extend-exclude = ["*/migrations*/*", "care/facility/**"]
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
  "F",  # pyflakes
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "I",  # isort
  "N",  # pep8-naming
  "UP", # pyupgrade
  # "ANN", # flake8-annotations
  "S",   # flake8-bandit
  "FBT", # flake8-boolean-trap
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "COM", # flake8-commas
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "T10", # flake8-debugger
  "DJ",  # flake8-django
  "EM",  # flake8-errmsg
  "ISC", # flake8-import-conventions
  "ICN", # flake8-import-order
  "LOG", # flake8-logging
  "G",   # flake8-logging-format
  "INP", # flake8-no-pep420
  "PIE", # flake8-pie
  "T20", # flake8-print
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SLF", # flake8-self
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "INT", # flake8-gettext
  # "ARG",  # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  # "TD",   # flake8-todo # disabling this for now
  "ERA",  # eradicate
  "PL",   # pylint
  "FURB", # refurb
  "RUF",  # ruff
]
unfixable = [
  "T20", # don't remove print statements
]
ignore = [
  "E203",    # whitespace-before-punctuation
  "E501",    # line-too-long
  "FBT002",  # boolean-default-value-positional-argument
  "SIM105",  # suppressible-exception
  "PLR0913", # too-many-arguments
  "PLW1641", # object does not have __hash__ method
  "DJ001",   # django-nullable-model-string-field
  "ISC001",  # conflicts with format
  "COM812",  # conflicts with format
  "RUF012",  # Too hard
  "FBT001",  # why not!
  "S106",
  "S105",
  "EM101",   # Why not!
  "ERA001",  # Lots of commented out code until the big merge!
  "PLC0415", # TODO: ignore specific warning for top level imports and remove the catchall
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402", "F401"] # for imports
"**/tests/**" = ["DTZ001"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "list", "filter"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
