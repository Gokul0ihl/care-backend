openapi: 3.0.3
info:
  title: Reception – Emergency Registration API
  version: 0.1.0
  description: |
    APIs backing the reception "Add patient → Register to Emergency" flow in the
    HIMS frontend (`/reception` routes):

    1. **Dashboard** – KPI cards and the patient search in the top bar.
    2. **Add patient** – mobile-number lookup ("Members on <number>").
    3. **Emergency registration** – patient details (gender, estimated age,
       distinguishing marks, medico-legal case, police station, triage) and the
       accompanying person, submitted together from "Register & Print".

    All endpoints are scoped to a facility, like the rest of the CARE API, and
    require the standard CARE JWT (`Authorization: Bearer <access token>`).

    Conventions follow CARE: `external_id` UUIDs are exposed as `id`,
    timestamps are ISO-8601 UTC, and validation errors return
    `400` with a `{field: [messages]}` body.
servers:
  - url: http://localhost:9000
    description: Local backend (Postgres database `care`)
tags:
  - name: Dashboard
  - name: Patient lookup
  - name: Emergency registration

security:
  - bearerAuth: []

paths:
  /api/v1/facility/{facility_id}/reception/dashboard/:
    get:
      tags: [Dashboard]
      operationId: getReceptionDashboard
      summary: KPI summary for the reception dashboard
      description: |
        Returns the four KPI cards. `change_percent` compares the current
        calendar month with the previous one (positive = increase).
      parameters:
        - $ref: "#/components/parameters/FacilityId"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
              example:
                total_patients: { value: 1234, change_percent: 12.0 }
                total_bookings: { value: 45, change_percent: 3.0 }
                active_cases: { value: 100, change_percent: -5.0 }
                avg_waiting_time_minutes: { value: 15, change_percent: -2.0 }
                generated_at: "2026-09-29T10:15:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/facility/{facility_id}/reception/patients/search/:
    get:
      tags: [Dashboard]
      operationId: searchReceptionPatients
      summary: Search patients by name, UHID or mobile number
      description: Powers the "Search patients, UHID, appointments" box.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - name: q
          in: query
          required: true
          description: Free text; at least 2 characters.
          schema: { type: string, minLength: 2, example: "Agarwal" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPatientSummaryList"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/facility/{facility_id}/reception/patients/lookup/:
    get:
      tags: [Patient lookup]
      operationId: lookupPatientsByPhone
      summary: List patients registered on a mobile number
      description: |
        Called by "Continue" on the Add patient screen. An empty `results`
        list means the number is new and the user starts a fresh
        registration; otherwise the "Members on <number>" screen is shown.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - name: country_code
          in: query
          required: true
          schema: { type: string, pattern: '^\+\d{1,4}$', example: "+91" }
        - name: phone_number
          in: query
          required: true
          schema: { type: string, pattern: '^\d{6,15}$', example: "9811024570" }
      responses:
        "200":
          description: Patients on this number (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPatientSummaryList"
              example:
                count: 1
                next: null
                previous: null
                results:
                  - id: "7c0c4b0e-2f5e-4c8e-9a51-8f1f2d4b9a10"
                    uhid: "POH-LN-2389302"
                    name: "Ansh Agarwal"
                    gender: male
                    age: 23
                    phone_number: "+919811024570"
                    last_visit: "2026-08-20"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/facility/{facility_id}/reception/emergency-registrations/:
    post:
      tags: [Emergency registration]
      operationId: createEmergencyRegistration
      summary: Register an emergency patient
      description: |
        Creates the patient, the emergency registration and the accompanying
        person in one transaction ("Register & Print").

        The server generates:
        - `uhid` – facility patient identifier (e.g. `POH-LN-12345`)
        - `medico_legal_case_number` – `MC-<year>-<sequence>`, only when
          `is_medico_legal_case` is true

        Name and date of birth are not required: emergency patients are
        often unidentified on arrival. The patient is stored as
        "Unknown <gender>" until details are updated.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyRegistrationCreate"
            example:
              contact:
                country_code: "+91"
                phone_number: "9876543210"
                same_as_whatsapp: true
              gender: male
              estimated_age: 45
              distinguishing_marks: "Scar on left forearm"
              is_medico_legal_case: true
              police_station_informed: "Dwarka Sector 9 Police Station"
              triage: red
              accompanying_person:
                title: Mr
                first_name: "Rahul"
                middle_name: ""
                last_name: "Sharma"
                country_code: "+91"
                phone_number: "9123456789"
                relationship: friend
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyRegistration"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Emergency registration]
      operationId: listEmergencyRegistrations
      summary: List emergency registrations
      description: Newest first. Used for the "Active Cases" drill-down.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - name: triage
          in: query
          schema: { $ref: "#/components/schemas/TriageLevel" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/RegistrationStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Emergency registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEmergencyRegistrationList"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/facility/{facility_id}/reception/emergency-registrations/{id}/:
    get:
      tags: [Emergency registration]
      operationId: getEmergencyRegistration
      summary: Get one emergency registration
      description: Used by the confirmation / print screen.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Emergency registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyRegistration"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Emergency registration]
      operationId: updateEmergencyRegistration
      summary: Update triage, status or details
      description: |
        Partial update, e.g. when the patient is later identified or the
        triage level changes. `uhid` and `medico_legal_case_number` are
        read-only.
      parameters:
        - $ref: "#/components/parameters/FacilityId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyRegistrationUpdate"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyRegistration"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FacilityId:
      name: facility_id
      in: path
      required: true
      description: Facility `external_id`.
      schema: { type: string, format: uuid }
    RegistrationId:
      name: id
      in: path
      required: true
      description: Emergency registration `external_id`.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  schemas:
    Gender:
      type: string
      description: Same values as CARE's patient gender.
      enum: [male, female, transgender, non_binary]

    TriageLevel:
      type: string
      description: |
        `red` – Immediate, `yellow` – Urgent, `green` – Delayed.
      enum: [red, yellow, green]

    RegistrationStatus:
      type: string
      enum: [active, admitted, discharged, transferred, cancelled]

    Relationship:
      type: string
      enum:
        [father, mother, spouse, son, daughter, brother, sister, friend, other]

    Title:
      type: string
      enum: [Mr, Mrs, Ms, Master, Baby, Dr]

    Kpi:
      type: object
      required: [value, change_percent]
      properties:
        value: { type: number, example: 1234 }
        change_percent:
          type: number
          description: Percentage change versus last month.
          example: 12.0

    DashboardSummary:
      type: object
      required:
        [
          total_patients,
          total_bookings,
          active_cases,
          avg_waiting_time_minutes,
          generated_at,
        ]
      properties:
        total_patients: { $ref: "#/components/schemas/Kpi" }
        total_bookings: { $ref: "#/components/schemas/Kpi" }
        active_cases:
          allOf: [{ $ref: "#/components/schemas/Kpi" }]
          description: Emergency registrations with status `active`.
        avg_waiting_time_minutes: { $ref: "#/components/schemas/Kpi" }
        generated_at: { type: string, format: date-time }

    PatientSummary:
      type: object
      required: [id, uhid, name, gender, phone_number]
      properties:
        id: { type: string, format: uuid }
        uhid: { type: string, example: "POH-LN-2389302" }
        name: { type: string, example: "Ansh Agarwal" }
        gender: { $ref: "#/components/schemas/Gender" }
        age: { type: integer, nullable: true, example: 23 }
        phone_number:
          type: string
          description: E.164 format.
          example: "+919811024570"
        last_visit: { type: string, format: date, nullable: true }

    PaginatedPatientSummaryList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        next: { type: string, format: uri, nullable: true }
        previous: { type: string, format: uri, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/PatientSummary" }

    ContactNumber:
      type: object
      required: [country_code, phone_number]
      properties:
        country_code:
          type: string
          pattern: '^\+\d{1,4}$'
          example: "+91"
        phone_number:
          type: string
          pattern: '^\d{6,15}$'
          example: "9876543210"
        same_as_whatsapp: { type: boolean, default: true }

    AccompanyingPerson:
      type: object
      required: [first_name, country_code, phone_number, relationship]
      properties:
        title: { $ref: "#/components/schemas/Title" }
        first_name: { type: string, maxLength: 100 }
        middle_name: { type: string, maxLength: 100, default: "" }
        last_name: { type: string, maxLength: 100, default: "" }
        country_code: { type: string, pattern: '^\+\d{1,4}$' }
        phone_number: { type: string, pattern: '^\d{6,15}$' }
        relationship: { $ref: "#/components/schemas/Relationship" }

    EmergencyRegistrationCreate:
      type: object
      required: [contact, gender, triage, accompanying_person]
      properties:
        contact:
          $ref: "#/components/schemas/ContactNumber"
        gender: { $ref: "#/components/schemas/Gender" }
        estimated_age:
          type: integer
          minimum: 0
          maximum: 130
          nullable: true
        distinguishing_marks: { type: string, maxLength: 500, default: "" }
        is_medico_legal_case: { type: boolean, default: true }
        police_station_informed:
          type: string
          maxLength: 255
          default: ""
          description: Name of the police station informed, if any.
        triage: { $ref: "#/components/schemas/TriageLevel" }
        accompanying_person:
          $ref: "#/components/schemas/AccompanyingPerson"

    EmergencyRegistrationUpdate:
      type: object
      description: Any subset of the writable fields.
      properties:
        gender: { $ref: "#/components/schemas/Gender" }
        estimated_age: { type: integer, minimum: 0, maximum: 130, nullable: true }
        distinguishing_marks: { type: string, maxLength: 500 }
        police_station_informed: { type: string, maxLength: 255 }
        triage: { $ref: "#/components/schemas/TriageLevel" }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        accompanying_person:
          $ref: "#/components/schemas/AccompanyingPerson"

    EmergencyRegistration:
      type: object
      required:
        [
          id,
          patient,
          contact,
          gender,
          triage,
          status,
          is_medico_legal_case,
          accompanying_person,
          created_date,
          modified_date,
        ]
      properties:
        id: { type: string, format: uuid }
        patient:
          $ref: "#/components/schemas/PatientSummary"
        medico_legal_case_number:
          type: string
          nullable: true
          readOnly: true
          example: "MC-2026-0042"
        contact:
          $ref: "#/components/schemas/ContactNumber"
        gender: { $ref: "#/components/schemas/Gender" }
        estimated_age: { type: integer, nullable: true }
        distinguishing_marks: { type: string }
        is_medico_legal_case: { type: boolean }
        police_station_informed: { type: string }
        triage: { $ref: "#/components/schemas/TriageLevel" }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        accompanying_person:
          $ref: "#/components/schemas/AccompanyingPerson"
        created_by:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        created_date: { type: string, format: date-time }
        modified_date: { type: string, format: date-time }
      example:
        id: "3f5d1a7e-9b2c-4e11-8a6f-2c1d0b9e7f44"
        patient:
          id: "b1e2c3d4-5f60-4a7b-8c9d-0e1f2a3b4c5d"
          uhid: "POH-LN-48213"
          name: "Unknown Male"
          gender: male
          age: 45
          phone_number: "+919876543210"
          last_visit: null
        medico_legal_case_number: "MC-2026-0042"
        contact:
          country_code: "+91"
          phone_number: "9876543210"
          same_as_whatsapp: true
        gender: male
        estimated_age: 45
        distinguishing_marks: "Scar on left forearm"
        is_medico_legal_case: true
        police_station_informed: "Dwarka Sector 9 Police Station"
        triage: red
        status: active
        accompanying_person:
          title: Mr
          first_name: "Rahul"
          middle_name: ""
          last_name: "Sharma"
          country_code: "+91"
          phone_number: "9123456789"
          relationship: friend
        created_by: { id: "0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9", username: "care-staff" }
        created_date: "2026-09-29T10:20:00Z"
        modified_date: "2026-09-29T10:20:00Z"

    PaginatedEmergencyRegistrationList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        next: { type: string, format: uri, nullable: true }
        previous: { type: string, format: uri, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/EmergencyRegistration" }

    ValidationErrors:
      type: object
      description: Field name → list of messages (Django REST Framework format).
      additionalProperties:
        type: array
        items: { type: string }
      example:
        triage: ["\"orange\" is not a valid choice."]
        accompanying_person:
          phone_number: ["Enter a valid phone number."]

    Detail:
      type: object
      properties:
        detail: { type: string }

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrors" }
    Unauthorized:
      description: Missing or expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Detail" }
          example: { detail: "Authentication credentials were not provided." }
    Forbidden:
      description: User has no access to this facility
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Detail" }
    NotFound:
      description: Facility or registration not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Detail" }
